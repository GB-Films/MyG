name: Publicar acceso en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar acceso público
        shell: bash
        run: cp github-pages/index.html github-pages/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
