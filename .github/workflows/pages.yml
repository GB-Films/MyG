name: Publicar acceso en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "github-pages/**"
      - "github-pages-vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construir invitación para GitHub Pages
        run: npx vite build --config github-pages-vite.config.ts
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
