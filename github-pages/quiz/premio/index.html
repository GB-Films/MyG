<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10100f" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon-rings-staggered.png" />
    <title>Video</title>
    <style>
      :root { color-scheme: dark; background: #000; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      video { display: block; max-width: 100vw; max-height: 100vh; max-height: 100dvh; object-fit: contain; }
    </style>
  </head>
  <body>
    <main>
      <video controls playsinline preload="metadata" aria-label="Video del quiz">
        <source src="/video-quiz-2.mp4" type="video/mp4" />
        <a href="/video-quiz-2.mp4">Abrir el video</a>
      </video>
    </main>
  </body>
</html>
