<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10100f" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon-rings-staggered.png" />
    <title>Video sorpresa · María &amp; Guido</title>
    <style>
      :root { color-scheme: dark; background: #10100f; color: #fff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; font-family: Arial, sans-serif; }
      main { width: min(100%, 900px); text-align: center; }
      p { margin: 0 0 8px; color: #ff4249; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0 0 20px; font: 400 clamp(32px, 7vw, 56px)/1.1 Georgia, serif; }
      video { display: block; width: min(100%, 42.75dvh); aspect-ratio: 9 / 16; margin-inline: auto; object-fit: contain; background: #000; border-radius: 8px; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <p>María &amp; Guido</p>
      <h1>Video sorpresa</h1>
      <video controls playsinline preload="metadata" aria-label="Video sorpresa de María y Guido">
        <source src="/video-quiz.mp4" type="video/mp4" />
        <a href="/video-quiz.mp4">Abrir el video</a>
      </video>
    </main>
  </body>
</html>
