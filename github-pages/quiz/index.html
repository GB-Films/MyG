<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta
      name="description"
      content="Quiz de películas de María y Guido. Elegí una película y superá diez desafíos seguidos."
    />
    <link rel="canonical" href="https://casamientomyg.com.ar/quiz/" />
    <link rel="icon" type="image/png" href="/favicon-rings-staggered.png" />
    <title>Quiz de películas · María &amp; Guido</title>
    <style>
      :root {
        color-scheme: dark;
        background: #050505;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      html,
      body {
        min-height: 100%;
        overflow: hidden;
        background: #050505;
      }

      iframe {
        display: block;
        border: 0;
        background: #050505;
      }

      .fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }

      .fallback a {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <iframe
      src="https://guidoboetsch.github.io/QUIZ-PELIS/"
      title="Quiz de películas"
      allow="fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <noscript>
      <p class="fallback">
        <a href="https://guidoboetsch.github.io/QUIZ-PELIS/">Abrir el quiz de películas</a>
      </p>
    </noscript>
  </body>
</html>
